
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Vocabulary Cards</title>

  <style>
    body {
       font-family: Arial, sans-serif;
  text-align: center;
  padding: 30px 15px;
  
  
}

    h1 { color: #e6d009; }
    h2 { color: #e9e0e0fe; }
    .card {
  
  background: #48a9d2bf;
  background-size: cover;
  
  max-width: 420px;
  min-height: 250px;
  margin: 20px auto;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.655); /* ကတ်ပြား ပိုကြွလာအောင် အရိပ်ကို နည်းနည်း ပိုရင့်ထားပါသည် */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  padding: 30px 20px;
  box-sizing: border-box;
  transition: transform 0.2s, box-shadow 0.2s;
}


    #word { font-size: 30px; font-weight: (193, 169, 12); color: #0e0601; }
    #meaning { font-size: 22px; color: #372d37; }
    #hint { color: #463a46; margin-top: 15px; }

    button {
      padding: 12px 20px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      background: #0210077f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover { background: #7e0764; }
  
    #scoreBoard { 
      display: inline-block;
      color: #1e1b4b; 
      font-size: 18px; 
      font-weight: bold; 
      background: #bbf7d0; /* စိမ်းနုရောင်နောက်ခံ */
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin: 0;
    }

    /* Card No ပြသမည့် Box ဒီဇိုင်း */
    #count { 
      display: inline-block;
      color: #1e1b4b; 
      font-size: 18px; 
      font-weight: bold; 
      background: #fef08a; /* ဝါနုရောင်နောက်ခံ */
      padding: 8px 18px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      margin: 0;
    }
    #bgVideo {
  position: fixed;
  right: 0;
  bottom: 0;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  z-index: -100; /* ကတ်ပြားများနှင့် ခလုတ်များရဲ့ အောက်ခြေသို့ ပို့ထားခြင်း */
  object-fit: cover;
}


  </style>
</head>

<body>
     <video autoplay loop muted playsinline id="bgVideo">
    <source src="celll.mp4" type="video/mp4">
  </video>

</video>
  <h1>Lesson 2</h1>
  <h2>Cell Processes and Energy</h2>

  <div class="info-container">
    <span id="count"></span>
    <p id="scoreBoard">Score: 0 / 0</p> 
  </div>

  <!-- ကတ်ပြားကိုနှိပ်ရင် လှန်ပေးမည့် စနစ်တစ်ခုပဲ ချန်ထားပါသည် -->
  <div class="card" onclick="flipCard()">
    <div id="word"></div>
    <div id="meaning" hidden></div>
    <div id="example"></div>
    <p id="hint">Click the card to see the answer</p>
  </div>

  <div class="controls-row">
    <button id="prevBtn" onclick="previousCard()">Previous</button>
    <!-- Show Answer ခလုတ်က နေရာလွဲမသွားစေရန် ဤနေရာမှ တိုက်ရိုက်ထိန်းချုပ်မှုကို ဖြုတ်ထားပါသည် -->
    <button id="flipBtn" onclick="flipCard()">Show Answer</button>
    <button id="nextBtn" onclick="nextCard()">Next</button>
  </div>

  <div id="scoringSection" class="controls-row" hidden>
    <button class="btn-correct" onclick="markCard(true)">✔️ Correct (မှန်တယ်)</button>
    <button class="btn-incorrect" onclick="markCard(false)">❌ Incorrect (မှားတယ်)</button>
  </div>
  
  <br>
  <button id="restartBtn" onclick="goToFirstCard()">Reset / Go to Card 1</button>

  <script>
    function goToFirstCard() {
  current = 0;
  showCard();
}
    const cards = [
      
  {
    word: "Cell process (Noun)",
    meaning: "ဆဲလ်အတွင်း ဖြစ်ပေါ်သော လုပ်ငန်းစဉ်",

  },
  {

  {

  },
  {

  },

  },
  {

    meaning: "ဘက်တီးရီးယားများ",

  },
  {
    word: "Photosynthesis (Noun)",
    meaning: "အလင်းမှီအစာချက်လုပ်ခြင်း",
    example: "Plants make food through photosynthesis."
  },
  {
    word: "Sunlight (Noun)",
    meaning: "နေရောင်ခြည်",
    example: "Plants need sunlight for photosynthesis."
  },
  {
    word: "Chemical reaction (Noun)",
    meaning: "ဓာတုတုံ့ပြန်မှု",
    example: "Photosynthesis involves chemical reactions."
  },
  {
    word: "Carbon dioxide (Noun)",
    meaning: "ကာဗွန်ဒိုင်အောက်ဆိုဒ် (CO₂)",

  },
  {
    word: "Water (Noun)",

  },
  {

  },
  {
    word: "Glucose (Noun)",
    meaning: "ဂလူးကို့စ်၊ ရိုးရှင်းသောသကြားတစ်မျိုး",
    example: "Plants produce glucose."
  },
  {
    word: "Chloroplast (Noun)",
    meaning: "အလင်းမှီအစာချက်လုပ်မှု ဖြစ်ပေါ်ရာ ဆဲလ်အစိတ်အပိုင်း",
    example: "Chloroplasts are found in plant cells."
  },
  {
    word: "Chlorophyll (Noun)",
    meaning: "ကလိုရိုဖီးလ်၊ အစိမ်းရောင်ရောင်ခြယ်ပစ္စည်း",
    example: "Chlorophyll absorbs light energy."
  },
  {
    word: "Pigment (Noun)",
    meaning: "ရောင်ခြယ်ပစ္စည်း",

  },
  {

  },
  {
    word: "Raw material (Noun)",
    meaning: "ကုန်ကြမ်း၊ တုံ့ပြန်မှုအတွက် လိုအပ်သော မူလပစ္စည်း",
    example: "Water is a raw material for photosynthesis."
  },
  {
    word: "Product (Noun)",
    meaning: "ထွက်ကုန်၊ တုံ့ပြန်မှုမှ ရရှိသောပစ္စည်း",
    example: "Oxygen is a product of photosynthesis."
  },
  {
    word: "Carbohydrate (Noun)",
    meaning: "ကာဗိုဟိုက်ဒရိတ်၊ စွမ်းအင်ပေးသော အာဟာရဓာတ်",
    example: "Glucose is a carbohydrate."
  },
  {
    word: "Break down (Phrasal verb)",
    meaning: "ဖြိုခွဲသည်၊ ခွဲခြမ်းဖျက်ဆီးသည်",

  },
  {
    word: "Release (Verb)",
    meaning: "ထုတ်လွှတ်သည်",
    example: "Plants release oxygen."
  },
  {
    word: "Cellular respiration (Noun)",
    meaning: "ဆဲလ်အသက်ရှူခြင်း၊ ဂလူးကို့စ်မှ စွမ်းအင်ရယူသည့် လုပ်ငန်းစဉ်",
    example: "Cells release energy through cellular respiration."
  },
  {
    word: "Atmosphere (Noun)",
    meaning: "လေထု",
    example: "Oxygen is released into the atmosphere."
  },
  {
    word: "Waste product (Noun)",
    meaning: "စွန့်ပစ်ပစ္စည်း၊ လုပ်ငန်းစဉ်မှ ထွက်လာသော အပိုပစ္စည်း",
    example: "Plants release oxygen as a waste product of photosynthesis."
  },
  {
    word: "Organism (Noun)",
    meaning: "သက်ရှိတစ်ခု",

  {

    meaning: "အရွက်၏ အလင်းမှီအစာချက်လုပ်မှု အဓိကဖြစ်ပေါ်ရာ ဆဲလ်",
    example: "Photosynthesis occurs mainly in palisade cells."
  },
  {

  },
  {

  },
  {
    word: "Stoma (Noun)",
    meaning: "အရွက်ရှိ ဓာတ်ငွေ့ဝင်ထွက်ပေါက် တစ်ပေါက်",
    example: "Carbon dioxide enters through a stoma."
  },
  {

    meaning: "Stoma ၏ အများကိန်း၊ အရွက်ရှိ ဓာတ်ငွေ့ဝင်ထွက်ပေါက်များ",
    example: "Carbon dioxide enters through stomata."
  },
  {
    word: "Xylem (Noun)",
    meaning: "အပင်အတွင်း ရေနှင့် သတ္တုဓာတ်များ သယ်ပို့သော တစ်ရှူး",
    example: "Xylem transports water."
  },
  {
    word: "Diffuse (Verb)",
    meaning: "ပျံ့နှံ့သွားသည်",
    example: "Water diffuses from the xylem."
  },
  {
    word: "Transport (Verb)",
    meaning: "သယ်ယူပို့ဆောင်သည်",
    example: "Xylem transports water through a plant."
  },
  {
    word: "Greenhouse gas (Noun)",
    meaning: "အပူကို လေထုထဲတွင် ထိန်းသိမ်းစေသော ဖန်လုံအိမ်ဓာတ်ငွေ့",
    example: "Carbon dioxide is a greenhouse gas."
  },
  {
    word: "Global warming (Noun)",
    meaning: "ကမ္ဘာ့ပျမ်းမျှအပူချိန် မြင့်တက်လာခြင်း",
    example: "Greenhouse gases contribute to global warming."
  },
  {
    word: "Population (Noun)",
    meaning: "လူဦးရေ၊ သက်ရှိအုပ်စုတစ်စု၏ အရေအတွက်",
    example: "The population of plants increased."
  },
  {
    word: "Increase (Verb)",
    meaning: "တိုးလာသည်၊ တိုးမြှင့်သည်",
    example: "More light can increase photosynthesis."
  },
  {
    word: "Harvest (Noun / Verb)",
    meaning: "ရိတ်သိမ်းခြင်း / ရိတ်သိမ်းသည်",
    example: "Farmers harvest crops."
  }
   ];
let current = 0;
  let showingAnswer = false;
  let scores = new Array(cards.length).fill(null); // အမှတ်စာရင်းများ သိမ်းဆည်းရန်

  // ကတ်ပြားများကို စာမျက်နှာပေါ်တွင် ဖော်ပြပေးမည့် လုပ်ဆောင်ချက်
  function showCard() {
    document.getElementById("word").textContent = cards[current].word;
    document.getElementById("meaning").textContent = cards[current].meaning;
    document.getElementById("example").textContent = "Example: " + cards[current].example;

    document.getElementById("meaning").hidden = true;
    document.getElementById("word").hidden = false;
    document.getElementById("hint").textContent = "Click the card to see the answer";
    document.getElementById("count").textContent = `Card ${current + 1} of ${cards.length}`;

    document.getElementById("prevBtn").disabled = (current === 0);
    document.getElementById("nextBtn").disabled = (current === cards.length - 1);
    
    const scoreSec = document.getElementById("scoringSection");
    if (scoreSec) scoreSec.hidden = true;

    updateScoreBoard();
    showingAnswer = false;
  }

  function flipCard() {
    showingAnswer = !showingAnswer;
    document.getElementById("word").hidden = showingAnswer;
    document.getElementById("meaning").hidden = !showingAnswer;
    document.getElementById("hint").textContent = showingAnswer ? "Click to see the word" : "Click the card to see the answer";
    
    const scoreSec = document.getElementById("scoringSection");
    if (scoreSec && showingAnswer) scoreSec.hidden = false;
  }

  // ပြင်ဆင်ထားသော အမှတ်ပေးခလုတ် Function ဖြစ်ပါသည်
  function markCard(isCorrect) {
    scores[current] = isCorrect; 
    updateScoreBoard();

    if (current < cards.length - 1) {
      current++;
      
      // နောက်တစ်ကတ်ပြောင်းလျှင် အဖြေကိုပြန်ဝှက်ပြီး Word ကိုပဲ ပြန်စပေါ်စေမည့်စနစ်
      showingAnswer = false; 
      
      showCard();
    } else {
      const totalCorrect = scores.filter(score => score === true).length;
      alert(`🎉 အားလုံးပြီးဆုံးသွားပါပြီ။ သင့်ရမှတ်ကတော့ စုစုပေါင်း ၄၀ မှာ ${totalCorrect} မှတ် ရရှိပါတယ်ခင်ဗျာ။`);
    }
  }

  function updateScoreBoard() {
    const attempted = scores.filter(score => score !== null).length;
    const correct = scores.filter(score => score === true).length;
    const scoreElement = document.getElementById("scoreBoard");
    if (scoreElement) {
      scoreElement.textContent = `Score: ${correct} / ${attempted}`;
    }
  }

  function nextCard() {
    if (current < cards.length - 1) {
      current++;
      showingAnswer = false; // Next ခလုတ်နှိပ်လျှင်လည်း အဖြေကိုပြန်ဝှက်ရန်
      showCard();
    }
  }

  function previousCard() {
    if (current > 0) {
      current--;
      showingAnswer = false; // Previous ခလုတ်နှိပ်လျှင်လည်း အဖြေကိုပြန်ဝှက်ရန်
      showCard();
    }
  }

  function goToFirstCard() {
    current = 0;
    scores = new Array(cards.length).fill(null);
    showingAnswer = false;
    showCard();
  }

  // စာမျက်နှာစဖွင့်ချင်း ပထမဆုံးကတ်ကို ခေါ်ပေးရန်
  showCard();
</script>
